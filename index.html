<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Английский по аудио</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Английский">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#4a4a4a">
<style>
:root {
  color-scheme: dark;
  --bg: #4a4a4a;
  --panel: #404040;
  --ink: #e3e3e3;
  --muted: #c8c8c8;
  --line: #5e5e5e;
  --hover: #575757;
  --accent: #a9c4f5;
  --on-accent: #10192b;
  --current: #3c3c38;
  --word-on: #262626;
  --known: #e3e3e3;
  --medium: #f2bd63;
  --unknown: #ffa89b;
  --known-bg: #5f5f5f;
  --medium-bg: #5c4a24;
  --unknown-bg: #633a35;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

button, select, input { font: inherit; color: inherit; }

button {
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  cursor: pointer;
}
button:hover { background: var(--hover); }
button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Шапка */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.top h1 { margin: 0; font-size: 15px; font-weight: 600; }
.book-select {
  min-width: 0;
  max-width: 60%;
  padding: 5px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  font-weight: 600;
}
.top-actions { display: flex; align-items: center; gap: 8px; }
.warning { color: var(--unknown); font-size: 12px; }

/* Раскладка */
.layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
}

/* Текст */
.reader { position: relative; min-height: 0; overflow: hidden; }
.text {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 24px clamp(16px, 5vw, 64px) 40vh;
  font: calc(20px * var(--text-scale, 1))/1.75 Charter, "Bitstream Charter", Georgia, Cambria, serif;
}
.text p {
  max-width: 44em;
  margin: 0 auto 1em;
  content-visibility: auto;
  contain-intrinsic-size: auto 10em;
}
.sent {
  padding: 3px 0;
  border-radius: 4px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  cursor: pointer;
}
.sent.cur { background: var(--current); }
.w { border-radius: 3px; cursor: pointer; }
.w:hover { background: var(--hover); }
.w.on { background: var(--word-on); }
.w.sel { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Статусы слов */
.w.st-1 { color: var(--known); }
.w.st-2 { color: var(--medium); }
.w.st-3 { color: var(--unknown); }

.follow {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
}
.follow:hover { background: var(--accent); filter: brightness(1.1); }

/* Панель слов */
.words {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 12px;
  border-left: 1px solid var(--line);
  background: var(--panel);
}
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 2px;
  line-height: 1.2;
  border-color: transparent;
  background: transparent;
}
@media (hover: hover) { .stat:not([aria-pressed="true"]):hover { background: var(--hover); } }
/* Выбранный фильтр: плашка цвета статуса */
.stat[aria-pressed="true"] { background: var(--known-bg); border-color: var(--ink); color: var(--ink); }
.stat.st-2[aria-pressed="true"] { background: var(--medium-bg); border-color: var(--medium); }
.stat.st-3[aria-pressed="true"] { background: var(--unknown-bg); border-color: var(--unknown); }
.stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
.stat .num { display: flex; align-items: baseline; gap: 5px; }
.stat small { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.stat > span:last-child { font-size: 11px; color: var(--muted); }
.stat.st-1 b { color: var(--known); }
.stat.st-2 b { color: var(--medium); }
.stat.st-3 b { color: var(--unknown); }




.list-tools { display: flex; gap: 6px; margin-bottom: 6px; }
.list-tools input[type="search"] {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
}
.list-tools select {
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
}

.list {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  list-style: none;
  border-top: 1px solid var(--line);
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px;
  border-bottom: 1px solid var(--line);
  content-visibility: auto;
  contain-intrinsic-size: auto 36px;
}
.row.sel { background: var(--hover); }
.row-word {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  padding: 2px 4px;
  border: 0;
  background: transparent;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 15px;
}
.row-word small { margin-left: 4px; font-size: 11px; color: var(--muted); }
.row.st-1 .row-word { color: var(--known); }
.row.st-2 .row-word { color: var(--medium); }
.row.st-3 .row-word { color: var(--unknown); }

.dots { display: flex; gap: 3px; }
.dots button { width: 26px; height: 26px; padding: 0; font-size: 11px; font-weight: 600; color: var(--muted); }
.dots button.st-1:hover, .dots button.st-1.is { background: var(--known-bg); border-color: var(--known); color: var(--known); }
.dots button.st-2:hover, .dots button.st-2.is { background: var(--medium-bg); border-color: var(--medium); color: var(--medium); }
.dots button.st-3:hover, .dots button.st-3.is { background: var(--unknown-bg); border-color: var(--unknown); color: var(--unknown); }

.empty { color: var(--muted); text-align: center; }

/* Всплывающее окно слова */
.pop {
  position: fixed;
  z-index: 10;
  width: 280px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .22);
}
.pop-head { margin-bottom: 8px; color: var(--muted); font-size: 12px; }
.pop-head b { color: var(--ink); font-size: 18px; }
#popForms { margin-top: 2px; }
.pop-translation { margin: 0 0 10px; font-size: 16px; line-height: 1.3; color: var(--ink); }
.status-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.status-buttons button { padding: 6px 2px; font-size: 12px; font-weight: 600; }
.status-buttons kbd { font: inherit; font-weight: 400; opacity: .6; }
.status-buttons .st-1 { color: var(--known); }
.status-buttons .st-2 { color: var(--medium); }
.status-buttons .st-3 { color: var(--unknown); }
.status-buttons .st-1.is { background: var(--known-bg); border-color: var(--known); }
.status-buttons .st-2.is { background: var(--medium-bg); border-color: var(--medium); }
.status-buttons .st-3.is { background: var(--unknown-bg); border-color: var(--unknown); }
.pop-play { width: 100%; margin-top: 6px; }

/* Книга без аудио: плеер не нужен, остаются только кнопки внизу */
.text-only .player .seek, .text-only .player .main, .text-only .player .end { display: none; }
.text-only .controls { margin-top: 0; }

/* Плеер */
.player {
  padding-block: 8px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line);
  background: var(--panel);
}
.seek { display: flex; align-items: center; gap: 10px; }
.seek input { flex: 1; min-width: 0; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
/* Все кнопки внизу — одним рядом */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 8px;
}
.controls > .group:first-child { flex: 1; }
.controls button { white-space: nowrap; }
.group { display: flex; align-items: center; gap: 6px; }
.tools { flex: 1; justify-content: flex-end; }
.position { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.controls svg { display: block; width: 20px; height: 20px; }

/* Кнопки плеера: круглые, без рамки; «Играть» — крупный акцентный круг */
.main { gap: 4px; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 42px;
  height: 42px;
  padding: 0;
  border-color: transparent;
  border-radius: 50%;
  background: transparent;
}
.icon-btn:hover { background: var(--hover); }
.main .play {
  display: inline-grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin: 0 6px;
  padding: 0;
  border-color: var(--accent);
  border-radius: 50%;
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: 0 2px 10px rgb(0 0 0 / 30%);
}
.main .play svg { width: 24px; height: 24px; }
.main .play:hover { background: var(--accent); filter: brightness(1.08); }
.play .i-pause, .play.playing .i-play { display: none; }
.play.playing .i-pause { display: block; }

/* Сегменты: скорость и размер текста */
.seg {
  display: inline-flex;
  align-items: center;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg);
}
.seg button {
  height: 100%;
  min-width: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: 0;
  background: transparent;
  font-size: 17px;
}
.seg button:hover { background: var(--hover); }
.seg output {
  min-width: 46px;
  text-align: center;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.text-size .a-small { font-size: 12px; font-weight: 700; }
.text-size .a-large { font-size: 18px; font-weight: 700; }

/* Действия: значок и подпись, без заливки */
.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 12px;
  border-radius: 12px;
  background: transparent;
}
.tool-btn svg { width: 18px; height: 18px; }
.tool-btn.icon-only { width: 40px; padding: 0; justify-content: center; }

/* Обновление: всегда на месте; акцентное, когда новая версия уже скачана */
.update-btn .upd-icon { display: inline-grid; place-items: center; font-weight: 700; }
.update-btn.ready { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.update-btn.ready:hover { background: var(--accent); filter: brightness(1.08); }
.update-btn.checking .upd-icon { animation: upd-spin 1s linear infinite; }
@keyframes upd-spin { to { transform: rotate(360deg); } }

/* Сенсорный экран: кнопки крупнее */
@media (pointer: coarse) {
  .dots button { width: 38px; height: 38px; font-size: 14px; }
  .status-buttons button { padding: 10px 2px; }
  .pop-play { padding: 10px; }
}

/* Выбор файлов книги на iPad */
.library {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  overflow-y: auto;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg);
}
.library-card { display: grid; gap: 12px; width: min(520px, 100%); }
.library-card h2 { margin: 0; font-size: 22px; text-wrap: balance; }
.library-card p { margin: 0; color: var(--muted); }
.library-card progress { width: 100%; height: 8px; accent-color: var(--accent); }
.library-card ol { display: grid; gap: 6px; margin: 0; padding-left: 20px; }
.library-files { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.library-files .ok { color: var(--known); }
.library-pick { justify-self: start; padding: 12px 18px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.library-pick:hover { background: var(--accent); filter: brightness(1.1); }
.library-error { color: var(--unknown); }

@media (max-width: 1100px) {
  .controls { gap: 10px; flex-wrap: wrap; }
  .controls > .group:first-child { display: none; }
  .tools { flex: 0 1 auto; }
}

/* Узкий iPad: процент размера текста и подписи кнопок убираем, чтобы всё встало в один ряд */
@media (max-width: 900px) {
  .controls { gap: 8px; }
  .text-size output { display: none; }
  .main { gap: 2px; }
}
@media (max-width: 1000px) {
  .tool-btn span { display: none; }
  .tool-btn { width: 40px; padding: 0; justify-content: center; }
}

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); }
  .words { border-left: 0; border-top: 1px solid var(--line); }
  .text { font-size: calc(18px * var(--text-scale, 1)); }
}
</style>
</head>
<body>
<header class="top">
  <h1 id="title"></h1>
  <select id="bookSelect" class="book-select" aria-label="Книга" hidden></select>
  <div class="top-actions">
    <span id="saveWarning" class="warning" hidden></span>
  </div>
</header>

<main class="layout">
  <section class="reader" aria-label="Текст">
    <div id="text" class="text"></div>
    <button id="followBtn" class="follow" type="button" hidden>↓ К текущему предложению</button>
  </section>

  <aside class="words" aria-label="Слова">
    <!-- Числа — это и статистика, и фильтр списка: нажатие показывает слова с этим статусом -->
    <div class="stats" id="filters" role="group" aria-label="Статистика и фильтр слов">
      <button type="button" class="stat" data-filter="all" title="Показать все слова"><b id="nAll"></b><span>Всего</span></button>
      <button type="button" class="stat st-3" data-filter="3" title="Показать слова «Не знаю»"><span class="num"><b id="n3"></b><small id="p3"></small></span><span>Не знаю</span></button>
      <button type="button" class="stat st-2" data-filter="2" title="Показать слова «Средне»"><span class="num"><b id="n2"></b><small id="p2"></small></span><span>Средне</span></button>
      <button type="button" class="stat st-1" data-filter="1" title="Показать слова «Знаю»"><span class="num"><b id="n1"></b><small id="p1"></small></span><span>Знаю</span></button>
    </div>


    <div class="list-tools">
      <input id="search" type="search" placeholder="Поиск слова" aria-label="Поиск слова" autocomplete="off">
      <select id="sort" aria-label="Сортировка">
        <option value="freq">Частые</option>
        <option value="alpha">А–Я</option>
        <option value="first">По тексту</option>
      </select>
    </div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>Нет слов для этого фильтра</p>
  </aside>
</main>

<footer class="player" aria-label="Плеер">
  <div class="seek">
    <span id="timeNow" class="time">0:00</span>
    <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Позиция">
    <span id="timeAll" class="time">0:00</span>
  </div>
  <div class="controls">
    <div class="group">
      <span id="position" class="position"></span>
    </div>
    <div class="group main">
      <button id="prevBtn" class="icon-btn" type="button" title="Предыдущее предложение (←)" aria-label="Предыдущее предложение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 9.5 12l8.5 6z" fill="currentColor"/><path d="M6 6v12"/></svg></button>
      <button id="back5Btn" class="icon-btn" type="button" title="Назад 5 секунд (Shift+←)" aria-label="Назад 5 секунд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 3.5v5h5"/><text x="12" y="15.8" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">5</text></svg></button>
      <button id="playBtn" class="play" type="button" title="Пауза / воспроизведение (Пробел)" aria-label="Воспроизведение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="i-play" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="i-pause" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/></svg></button>
      <button id="fwd5Btn" class="icon-btn" type="button" title="Вперёд 5 секунд (Shift+→)" aria-label="Вперёд 5 секунд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5v5h-5"/><text x="12" y="15.8" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">5</text></svg></button>
      <button id="nextBtn" class="icon-btn" type="button" title="Следующее предложение (→)" aria-label="Следующее предложение"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l8.5 6L6 18z" fill="currentColor"/><path d="M18 6v12"/></svg></button>
    </div>
    <div class="group end">
      <span class="seg speed" role="group" aria-label="Скорость">
        <button id="slowerBtn" type="button" title="Медленнее ([)" aria-label="Медленнее">−</button>
        <output id="speed">1.0×</output>
        <button id="fasterBtn" type="button" title="Быстрее (])" aria-label="Быстрее">+</button>
      </span>
    </div>
    <div id="tools" class="group tools">
      <span class="seg text-size" role="group" aria-label="Размер текста">
        <button id="smallerTextBtn" class="a-small" type="button" title="Уменьшить текст (-)" aria-label="Уменьшить текст">A</button>
        <output id="textSize">100%</output>
        <button id="largerTextBtn" class="a-large" type="button" title="Увеличить текст (+)" aria-label="Увеличить текст">A</button>
      </span>
      <button id="addBookBtn" class="tool-btn" type="button" title="Добавить книгу" aria-label="Добавить книгу" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19V6a2 2 0 0 1 2-2h12v13H7a2 2 0 0 0-2 2 2 2 0 0 0 2 2h12"/><path d="M12 7.5v6M9 10.5h6"/></svg><span>Книга</span></button>
      <button id="exportBtn" class="tool-btn" type="button" title="Сохранить статусы слов в файл"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg><span>Экспорт</span></button>
      <button id="importBtn" class="tool-btn" type="button" title="Загрузить статусы слов из файла"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 20h14"/></svg><span>Импорт</span></button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>

// Хранение в браузере: статусы слов общие для всех книг, позиция у каждой книги своя
window.createLocalStore = function () {
  const WORDS_KEY = "audio-english:words";
  const SETTINGS_KEY = "audio-english:settings";
  const POSITION_PREFIX = "audio-english:position:";
  let notice = () => {};
  let wordsListener = () => {};
  let words = {};

  function read(key) {
    try {
      return JSON.parse(localStorage.getItem(key));
    } catch (e) {
      return null;
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      notice("Браузер не сохраняет прогресс. Сохраните статусы кнопкой «Экспорт».");
    }
  }

  words = read(WORDS_KEY) || {};

  return {
    read,
    write,
    words: () => Object.assign({}, words),
    setWord(word, status) {
      this.setWords({ [word]: status });
    },
    setWords(changes) {
      Object.keys(changes).forEach((word) => {
        if (changes[word]) words[word] = changes[word]; else delete words[word];
      });
      write(WORDS_KEY, words);
    },
    replaceWords(next) {
      words = next;
      write(WORDS_KEY, words);
      wordsListener(this.words());
    },
    position: (bookId) => read(POSITION_PREFIX + bookId) || 0,
    // Все позиции разом — для резервной копии
    positions() {
      const out = {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith(POSITION_PREFIX)) out[key.slice(POSITION_PREFIX.length)] = read(key) || 0;
        }
      } catch (e) { /* хранилище недоступно */ }
      return out;
    },
    savePosition: (bookId, seconds) => write(POSITION_PREFIX + bookId, seconds),
    settings: () => read(SETTINGS_KEY) || {},
    saveSettings: (settings) => write(SETTINGS_KEY, settings),
    onWordsChanged(listener) {
      wordsListener = listener;
    },
    onNotice(listener) {
      notice = listener;
    },
    notify: (text) => notice(text),

    // Прежний формат: статусы и позиция лежали вместе под названием книги
    adoptOldFormat(book) {
      const oldKey = "audio-english:" + book.title;
      const old = read(oldKey);
      if (!old) return;
      this.setWords(Object.assign({}, old.statuses, words));
      if (!this.position(book.id) && old.position) this.savePosition(book.id, old.position);
      localStorage.removeItem(oldKey);
    },
  };
};

window.startAudioEnglish = function (book, env) {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const KNOWN = 1, MEDIUM = 2, UNKNOWN = 3, NONE = 0;
  const STATUS_CLASSES = ["", "st-1", "st-2", "st-3"];
  const TEXT_SCALES = [0.7, 0.8, 0.9, 1, 1.1, 1.2, 1.35, 1.5, 1.75, 2];
  const SPEEDS = [0.5, 0.6, 0.7, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];

  const audio = $("audio");
  const times = book.times.map((ms) => ms / 1000);
  // Книга без аудио: только текст, место чтения — номер предложения вверху экрана
  const textOnly = !!book.noAudio || !times.length;
  const starts = book.sentenceStarts;

  // Состояние, которое переживает перезагрузку страницы
  const state = { statuses: {}, position: 0, speed: 1, sort: "freq", filters: [], textScale: 1 };

  // Начальная форма для каждой формы слова этой книги
  const lemmaOf = {};
  book.forms.forEach((forms, v) => forms.forEach((form) => { lemmaOf[form] = book.vocab[v]; }));

  // Индексы по токенам и словарю
  const wordSpans = book.vocab.map(() => []);
  const vocabCount = new Array(book.vocab.length).fill(0);
  const vocabFirst = new Array(book.vocab.length).fill(-1);
  book.tokenVocab.forEach((v, i) => {
    if (v < 0) return;
    vocabCount[v]++;
    if (vocabFirst[v] < 0) vocabFirst[v] = i;
  });
  const tokenSpans = new Array(book.tokens.length);
  const sentenceEls = new Array(starts.length);

  let currentToken = -1;
  let currentSentence = 0;
  let follow = !textOnly;
  let selected = -1; // индекс слова в словаре
  let selectedToken = -1;
  let seeking = false;

  /* ---------- Сохранение ---------- */

  // Приводит статусы к начальным формам. Если у форм одного слова статусы
  // разные, остаётся самый осторожный: не знаю > средне > знаю.
  function adoptStatuses(raw) {
    const out = {}, changes = {};
    Object.keys(raw).forEach((word) => {
      if (!raw[word]) return;
      const lemma = lemmaOf[word] || word;
      out[lemma] = Math.max(out[lemma] || 0, raw[word]);
      if (lemma !== word) changes[word] = NONE;
    });
    Object.keys(changes).forEach((word) => {
      const lemma = lemmaOf[word];
      if (!out[word]) changes[lemma] = out[lemma];
    });
    if (Object.keys(changes).length) env.store.setWords(changes);
    return out;
  }

  function load() {
    Object.assign(state, env.store.settings());
    state.filters = (state.filters || []).filter((s) => s !== NONE);
    state.position = env.store.position(book.id);
    state.statuses = adoptStatuses(env.store.words());
  }

  function save() {
    env.store.saveSettings({
      speed: state.speed, sort: state.sort, filters: state.filters,
      textScale: state.textScale, book: book.id,
    });
  }

  function savePosition(durable) {
    env.store.savePosition(book.id, state.position, durable);
  }

  // Слово, которое ещё не отмечали, считается незнакомым
  const statusOf = (v) => state.statuses[book.vocab[v]] || UNKNOWN;

  /* ---------- Поиск по времени ---------- */

  function tokenAt(t) {
    let lo = 0, hi = times.length - 1, found = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (times[mid] <= t) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return found;
  }

  function sentenceOfToken(i) {
    let lo = 0, hi = starts.length - 1, found = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (starts[mid] <= i) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return found;
  }

  const sentenceStart = (s) => times[starts[s]];

  /* ---------- Отрисовка текста ---------- */

  function renderText() {
    const root = $("text");
    const frag = document.createDocumentFragment();
    const paragraphStarts = book.paragraphStarts ? new Set(book.paragraphStarts) : null;
    let paragraph = null;
    starts.forEach((start, s) => {
      if (!paragraph || (paragraphStarts ? paragraphStarts.has(s) : s % book.sentencesPerParagraph === 0)) {
        paragraph = document.createElement("p");
        frag.appendChild(paragraph);
      }
      const end = s + 1 < starts.length ? starts[s + 1] : book.tokens.length;
      const sentence = document.createElement("span");
      sentence.className = "sent";
      sentence.dataset.s = s;
      for (let i = start; i < end; i++) {
        const span = document.createElement("span");
        span.textContent = book.tokens[i];
        span.dataset.i = i;
        const v = book.tokenVocab[i];
        span.className = "w";
        if (v >= 0) {
          wordSpans[v].push(span);
          const st = statusOf(v);
          if (st) span.classList.add(STATUS_CLASSES[st]);
        }
        tokenSpans[i] = span;
        sentence.appendChild(span);
        sentence.appendChild(document.createTextNode(" "));
      }
      sentenceEls[s] = sentence;
      paragraph.appendChild(sentence);
    });
    root.appendChild(frag);
  }

  function setCurrent(token) {
    if (token === currentToken) return;
    if (currentToken >= 0) tokenSpans[currentToken].classList.remove("on");
    currentToken = token;
    if (token >= 0) tokenSpans[token].classList.add("on");

    const s = sentenceOfToken(Math.max(token, 0));
    if (s !== currentSentence || !sentenceEls[s].classList.contains("cur")) {
      sentenceEls[currentSentence].classList.remove("cur");
      currentSentence = s;
      sentenceEls[s].classList.add("cur");
      $("position").textContent = "Предложение " + (s + 1) + " из " + starts.length;
      if (follow && $("pop").hidden) scrollToCurrent();
    }
  }

  function scrollToCurrent(force) {
    const el = sentenceEls[currentSentence];
    const box = $("text").getBoundingClientRect();
    const r = el.getBoundingClientRect();
    if (!force && r.top >= box.top + box.height * 0.1 && r.bottom <= box.top + box.height * 0.6) return;
    // Плавно только рядом: далёкий переход должен быть мгновенным, абзацы вне экрана ещё не измерены
    const near = !force && Math.abs(r.top - box.top) < box.height * 1.5;
    el.scrollIntoView({ block: "center", behavior: near ? "smooth" : "auto" });
    if (!near) requestAnimationFrame(() => el.scrollIntoView({ block: "center" }));
  }

  function setFollow(on) {
    if (textOnly) on = false;
    follow = on;
    $("followBtn").hidden = on;
    if (on) scrollToCurrent(true);
  }

  /* ---------- Плеер ---------- */

  // iPad иногда не принимает перемотку сразу после загрузки: повторяем её, пока не сработает
  let restoreAt = null;

  function seekTo(t) {
    restoreAt = null;
    if (textOnly) return;
    const max = isFinite(audio.duration) ? audio.duration : t;
    audio.currentTime = Math.min(Math.max(t, 0), max);
    tick();
  }

  function goSentence(s, play) {
    const target = Math.min(Math.max(s, 0), starts.length - 1);
    if (textOnly) {
      setCurrent(starts[target]);
      scrollToCurrent();
      return;
    }
    seekTo(sentenceStart(target));
    setCurrent(starts[target]);
    if (!follow) setFollow(true);
    if (play) audio.play();
  }

  function togglePlay() {
    if (textOnly) return;
    if (audio.paused) audio.play(); else audio.pause();
  }

  function tick() {
    const t = audio.currentTime;
    setCurrent(tokenAt(t));

    if (!seeking && isFinite(audio.duration) && audio.duration > 0) {
      $("seek").value = String(Math.round((t / audio.duration) * 1000));
    }
    $("timeNow").textContent = formatTime(t);
  }

  function animate() {
    if (!audio.paused) tick();
    requestAnimationFrame(animate);
  }

  function formatTime(sec) {
    const s = Math.floor(sec || 0);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    const mm = h ? String(m).padStart(2, "0") : String(m);
    return (h ? h + ":" : "") + mm + ":" + String(r).padStart(2, "0");
  }

  function setSpeed(value) {
    state.speed = value;
    audio.playbackRate = value;
    $("speed").textContent = value + "×";
    save();
  }

  function stepSpeed(dir) {
    let i = SPEEDS.indexOf(state.speed);
    if (i < 0) i = SPEEDS.indexOf(1);
    setSpeed(SPEEDS[Math.min(Math.max(i + dir, 0), SPEEDS.length - 1)]);
  }

  function setTextScale(value) {
    state.textScale = value;
    document.documentElement.style.setProperty("--text-scale", String(value));
    $("textSize").textContent = Math.round(value * 100) + "%";
    clearSelection();
    if (follow) scrollToCurrent(true);
    save();
  }

  function stepTextScale(dir) {
    let i = TEXT_SCALES.indexOf(state.textScale);
    if (i < 0) i = TEXT_SCALES.indexOf(1);
    setTextScale(TEXT_SCALES[Math.min(Math.max(i + dir, 0), TEXT_SCALES.length - 1)]);
  }

  /* ---------- Статусы слов ---------- */

  function setStatus(v, status) {
    const word = book.vocab[v];
    state.statuses[word] = status;
    applyStatus(v);
    renderStats();
    env.store.setWord(word, status);
  }

  function applyStatus(v) {
    const st = statusOf(v);
    wordSpans[v].forEach((span) => {
      span.classList.remove("st-1", "st-2", "st-3");
      if (st) span.classList.add(STATUS_CLASSES[st]);
    });
    const row = $("list").querySelector('[data-v="' + v + '"]');
    if (row) paintRow(row, st);
    if (v === selected) paintPop();
  }

  function renderStats() {
    const n = [0, 0, 0, 0];
    book.vocab.forEach((_, v) => { n[statusOf(v)]++; });
    const total = book.vocab.length;
    $("nAll").textContent = total;
    $("n1").textContent = n[KNOWN];
    $("n2").textContent = n[MEDIUM];
    $("n3").textContent = n[UNKNOWN];
    const shares = percents([n[KNOWN], n[MEDIUM], n[UNKNOWN]], total);
    [KNOWN, MEDIUM, UNKNOWN].forEach((st, k) => {
      $("p" + st).textContent = n[st] && !shares[k] ? "<1%" : shares[k] + "%";
    });
  }

  // Целые проценты, которые в сумме дают ровно 100: лишние единицы получают доли с большим остатком
  function percents(parts, total) {
    if (!total) return parts.map(() => 0);
    const exact = parts.map((p) => (p / total) * 100);
    const out = exact.map(Math.floor);
    let left = 100 - out.reduce((x, y) => x + y, 0);
    exact.map((e, k) => [e - out[k], k]).sort((x, y) => y[0] - x[0]).forEach(([, k]) => {
      if (left > 0) { out[k]++; left--; }
    });
    return out;
  }

  /* ---------- Список слов ---------- */

  function visibleVocab() {
    const query = $("search").value.trim().toLowerCase();
    const out = [];
    book.vocab.forEach((word, v) => {
      if (state.filters.length && !state.filters.includes(statusOf(v))) return;
      if (query && !book.forms[v].some((form) => form.includes(query)) && !word.includes(query)) return;
      out.push(v);
    });
    if (state.sort === "alpha") out.sort((a, b) => book.vocab[a].localeCompare(book.vocab[b], "en"));
    if (state.sort === "first") out.sort((a, b) => vocabFirst[a] - vocabFirst[b]);
    return out; // словарь уже отсортирован по частоте
  }

  function paintRow(row, st) {
    row.classList.remove("st-1", "st-2", "st-3");
    if (st) row.classList.add(STATUS_CLASSES[st]);
    row.querySelectorAll(".dots button").forEach((b) => {
      b.classList.toggle("is", Number(b.dataset.set) === st);
    });
  }

  function otherForms(v, prefix) {
    const others = book.forms[v].filter((form) => form !== book.vocab[v]);
    return others.length ? prefix + others.join(", ") : "";
  }

  function buildRow(v) {
    const li = document.createElement("li");
    li.className = "row";
    li.dataset.v = v;
    if (v === selected) li.classList.add("sel");

    const word = document.createElement("button");
    word.type = "button";
    word.className = "row-word";
    word.title = "Показать перевод и следующее место, где встречается это слово";
    word.textContent = book.vocab[v];
    const count = document.createElement("small");
    count.textContent = "×" + vocabCount[v] + otherForms(v, " · ");
    word.appendChild(count);
    li.appendChild(word);

    const dots = document.createElement("span");
    dots.className = "dots";
    [["3", "?", "Не знаю"], ["2", "~", "Средне"], ["1", "✓", "Знаю"]].forEach(([set, mark, label]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "st-" + set;
      b.dataset.set = set;
      b.textContent = mark;
      b.title = label;
      b.setAttribute("aria-label", label + ": " + book.vocab[v]);
      dots.appendChild(b);
    });
    li.appendChild(dots);
    paintRow(li, statusOf(v));
    return li;
  }

  function renderList() {
    const list = $("list");
    const frag = document.createDocumentFragment();
    const items = visibleVocab();
    items.forEach((v) => frag.appendChild(buildRow(v)));
    list.textContent = "";
    list.appendChild(frag);
    $("empty").hidden = items.length > 0;
    document.querySelectorAll("#filters button").forEach((b) => {
      const active = b.dataset.filter === "all"
        ? state.filters.length === 0
        : state.filters.includes(Number(b.dataset.filter));
      b.setAttribute("aria-pressed", String(active));
    });
  }

  // Следующее после текущей позиции вхождение слова (по кругу)
  function nextOccurrence(v) {
    const spans = wordSpans[v];
    const from = Math.max(currentToken, selectedToken);
    for (const span of spans) {
      if (Number(span.dataset.i) > from) return Number(span.dataset.i);
    }
    return Number(spans[0].dataset.i);
  }

  /* ---------- Выбранное слово и всплывающее окно ---------- */

  function selectWord(v, token) {
    clearSelection();
    selected = v;
    selectedToken = token;
    if (token >= 0) tokenSpans[token].classList.add("sel");
    const row = $("list").querySelector('[data-v="' + v + '"]');
    if (row) row.classList.add("sel");
  }

  function clearSelection() {
    if (selectedToken >= 0) tokenSpans[selectedToken].classList.remove("sel");
    const row = selected >= 0 && $("list").querySelector('[data-v="' + selected + '"]');
    if (row) row.classList.remove("sel");
    selected = -1;
    selectedToken = -1;
    $("pop").hidden = true;
  }

  function paintPop() {
    const st = statusOf(selected);
    $("pop").querySelectorAll("[data-set]").forEach((b) => {
      b.classList.toggle("is", Number(b.dataset.set) === st);
    });
  }

  function openPop(v, token) {
    selectWord(v, token);
    const pop = $("pop");
    $("popWord").textContent = book.vocab[v];
    $("popCount").textContent = "в тексте: " + vocabCount[v];
    $("popForms").textContent = otherForms(v, "формы: ");
    $("popTranslation").textContent = window.DICTIONARY[book.vocab[v]] || "Перевода пока нет";
    paintPop();
    pop.hidden = false;
    placePop(token);
  }

  function placePop(token) {
    const pop = $("pop");
    const r = tokenSpans[token].getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.min(Math.max(r.left, 8), window.innerWidth - w - 8);
    const below = r.bottom + 6;
    const top = below + h < window.innerHeight - 8 ? below : Math.max(r.top - h - 6, 8);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  /* ---------- Экспорт и импорт ---------- */

  function exportStatuses() {
    const backup = { statuses: env.store.words() };
    if (env.store.positions) {
      state.position = audio.currentTime || state.position;
      savePosition(true);
      backup.positions = env.store.positions();
    }
    env.saveFile("статусы слов.json", JSON.stringify(backup, null, 1));
  }

  function showNotice(text) {
    $("saveWarning").textContent = text;
    $("saveWarning").hidden = !text;
  }

  // Статусы изменились извне (импорт или другое устройство)
  function applyRemote(raw) {
    const next = adoptStatuses(raw);
    const changed = book.vocab.reduce((list, word, v) => {
      if ((next[word] || UNKNOWN) !== statusOf(v)) list.push(v);
      return list;
    }, []);
    state.statuses = next;
    changed.forEach(applyStatus);
    if (changed.length) renderStats();
  }

  // Позиции из резервной копии берём только для книг, где позиции на устройстве нет
  function restorePositions(positions) {
    if (!positions || typeof positions !== "object") return;
    Object.keys(positions).forEach((id) => {
      const seconds = Number(positions[id]);
      if (!(seconds > 0) || env.store.position(id) > 0) return;
      env.store.savePosition(id, seconds, true);
      if (id === book.id && !(audio.currentTime > 1)) {
        state.position = seconds;
        if (audio.readyState) seekTo(seconds);
      }
    });
  }

  function importStatuses(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        // Импорт дополняет словарь и не стирает слова, которых нет в файле
        const incoming = JSON.parse(reader.result).statuses;
        const clean = {};
        Object.keys(incoming).forEach((word) => {
          if ([KNOWN, MEDIUM, UNKNOWN].includes(incoming[word])) clean[word] = incoming[word];
        });
        env.store.setWords(clean);
        applyRemote(env.store.words());
        restorePositions(JSON.parse(reader.result).positions);
        renderList();
        showNotice("Статусы загружены из файла: " + Object.keys(clean).length);
      } catch (e) {
        showNotice("Не удалось прочитать файл со статусами");
      }
    };
    reader.readAsText(file);
  }

  /* ---------- События ---------- */

  function bind() {
    audio.addEventListener("loadedmetadata", () => {
      $("timeAll").textContent = formatTime(audio.duration);
      if (state.position > 0 && state.position < audio.duration) {
        seekTo(state.position);
        restoreAt = state.position;
      }
      audio.playbackRate = state.speed;
    });
    audio.addEventListener("error", () => {
      if (env.onAudioError && env.onAudioError()) return;
      showNotice("Браузер не смог открыть аудиофайл. Статусы при этом не пострадали.");
    });
    audio.addEventListener("timeupdate", () => {
      if (restoreAt !== null) {
        if (Math.abs(audio.currentTime - restoreAt) > 2) {
          if (!audio.seeking) audio.currentTime = restoreAt;
          return;
        }
        restoreAt = null;
      }
      tick();
      state.position = audio.currentTime;
      savePosition(false);
    });
    audio.addEventListener("play", () => {
      $("playBtn").classList.add("playing");
      $("playBtn").setAttribute("aria-label", "Пауза");
    });
    audio.addEventListener("pause", () => {
      $("playBtn").classList.remove("playing");
      $("playBtn").setAttribute("aria-label", "Воспроизведение");
      if (restoreAt !== null) return;
      state.position = audio.currentTime;
      savePosition(true);
    });
    window.addEventListener("pagehide", () => {
      if (!audio.readyState || restoreAt !== null) return; // аудио ещё не встало на место, позицию не трогаем
      state.position = audio.currentTime;
      savePosition(true);
    });
    env.store.onWordsChanged(applyRemote);
    env.store.onNotice(showNotice);

    $("playBtn").addEventListener("click", togglePlay);
    $("prevBtn").addEventListener("click", () => goSentence(currentSentence - 1));
    $("nextBtn").addEventListener("click", () => goSentence(currentSentence + 1));
    $("back5Btn").addEventListener("click", () => seekTo(audio.currentTime - 5));
    $("fwd5Btn").addEventListener("click", () => seekTo(audio.currentTime + 5));
    $("slowerBtn").addEventListener("click", () => stepSpeed(-1));
    $("fasterBtn").addEventListener("click", () => stepSpeed(1));

    const seek = $("seek");
    seek.addEventListener("input", () => {
      seeking = true;
      $("timeNow").textContent = formatTime((seek.value / 1000) * (audio.duration || 0));
    });
    seek.addEventListener("change", () => {
      seeking = false;
      seekTo((seek.value / 1000) * (audio.duration || 0));
    });

    // Клик по слову: окно статуса. Клик по промежутку в предложении: переход к нему.
    $("text").addEventListener("click", (e) => {
      const span = e.target.closest(".w");
      if (span) {
        const i = Number(span.dataset.i);
        const v = book.tokenVocab[i];
        if (v >= 0) {
          if (textOnly) setCurrent(i);
          openPop(v, i);
          e.stopPropagation();
          return;
        }
      }
      const sentence = e.target.closest(".sent");
      if (sentence) goSentence(Number(sentence.dataset.s));
    });

    // Окно слова идёт за словом: абзацы вне экрана при измерении сдвигают текст
    let readTimer = null;
    $("text").addEventListener("scroll", () => {
      if (!$("pop").hidden) placePop(selectedToken);
      if (textOnly) {
        clearTimeout(readTimer);
        readTimer = setTimeout(saveReadingPlace, 400);
      }
    }, { passive: true });

    // Автопрокрутку отключает только прокрутка самим пользователем
    const onManualScroll = () => {
      clearSelection();
      if (follow) setFollow(false);
    };
    $("text").addEventListener("wheel", onManualScroll, { passive: true });
    $("text").addEventListener("touchmove", onManualScroll, { passive: true });
    $("text").addEventListener("pointerdown", (e) => {
      if (e.target === $("text")) onManualScroll(); // ползунок прокрутки
    });
    $("followBtn").addEventListener("click", () => setFollow(true));

    $("pop").addEventListener("click", (e) => {
      e.stopPropagation();
      const b = e.target.closest("[data-set]");
      if (b && selected >= 0) setStatus(selected, Number(b.dataset.set));
    });
    $("popPlay").addEventListener("click", () => {
      const token = selectedToken;
      clearSelection();
      seekTo(times[token]);
      setFollow(true);
      audio.play();
    });
    document.addEventListener("click", (e) => {
      if (!$("pop").hidden && !e.target.closest(".row")) clearSelection();
    });

    $("list").addEventListener("click", (e) => {
      const row = e.target.closest(".row");
      if (!row) return;
      const v = Number(row.dataset.v);
      const set = e.target.closest("[data-set]");
      if (set) {
        setStatus(v, Number(set.dataset.set));
        return;
      }
      if (e.target.closest(".row-word")) {
        const token = nextOccurrence(v);
        follow = false;
        $("followBtn").hidden = false;
        tokenSpans[token].scrollIntoView({ block: "center" });
        openPop(v, token);
        setTimeout(() => {
          if (selectedToken === token && !$("pop").hidden) placePop(token);
        }, 300);
        e.stopPropagation();
      }
    });

    $("filters").addEventListener("click", (e) => {
      const b = e.target.closest("[data-filter]");
      if (!b) return;
      if (b.dataset.filter === "all") {
        state.filters = [];
      } else {
        const status = Number(b.dataset.filter);
        state.filters = state.filters.includes(status)
          ? state.filters.filter((s) => s !== status)
          : state.filters.concat(status);
      }
      save();
      renderList();
    });
    $("search").addEventListener("input", renderList);
    $("sort").addEventListener("change", (e) => {
      state.sort = e.target.value;
      save();
      renderList();
    });
    $("bookSelect").addEventListener("change", (e) => env.selectBook(e.target.value));
    if (env.addBook) {
      $("addBookBtn").hidden = false;
      $("addBookBtn").addEventListener("click", env.addBook);
    }

    $("smallerTextBtn").addEventListener("click", () => stepTextScale(-1));
    $("largerTextBtn").addEventListener("click", () => stepTextScale(1));
    $("exportBtn").addEventListener("click", exportStatuses);
    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", (e) => {
      if (e.target.files[0]) importStatuses(e.target.files[0]);
      e.target.value = "";
    });

    // Кнопки не должны перехватывать пробел и стрелки после клика
    document.addEventListener("click", (e) => {
      const control = e.target.closest("button, input[type=range], input[type=checkbox]");
      if (control) control.blur();
    });

    document.addEventListener("keydown", (e) => {
      const tag = e.target.tagName;
      if (tag === "INPUT" && e.target.type === "search") {
        if (e.key === "Escape") { e.target.value = ""; renderList(); e.target.blur(); }
        return;
      }
      if (tag === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;

      const actions = {
        " ": togglePlay,
        ArrowLeft: () => (e.shiftKey ? seekTo(audio.currentTime - 5) : goSentence(currentSentence - 1)),
        ArrowRight: () => (e.shiftKey ? seekTo(audio.currentTime + 5) : goSentence(currentSentence + 1)),
        "[": () => stepSpeed(-1),
        "]": () => stepSpeed(1),
        "-": () => stepTextScale(-1),
        "=": () => stepTextScale(1),
        "+": () => stepTextScale(1),
        "/": () => $("search").focus(),
        Escape: clearSelection,
      };
      if (selected >= 0) {
        actions["1"] = () => setStatus(selected, KNOWN);
        actions["2"] = () => setStatus(selected, MEDIUM);
        actions["3"] = () => setStatus(selected, UNKNOWN);
      }
      const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (actions[key]) {
        e.preventDefault();
        actions[key]();
      }
    });
  }

  /* ---------- Книга без аудио ---------- */

  // Предложение у верхнего края текста — то место, где читатель остановился
  function topSentence() {
    const box = $("text").getBoundingClientRect();
    for (const dy of [8, 24, 48]) {
      const el = document.elementFromPoint(box.left + box.width / 2, box.top + dy);
      const sentence = el && el.closest(".sent");
      if (sentence) return Number(sentence.dataset.s);
    }
    return -1;
  }

  function saveReadingPlace() {
    const s = topSentence();
    if (s < 0) return;
    state.position = s;
    env.store.savePosition(book.id, s, true);
  }

  function restoreReadingPlace() {
    const s = Math.min(Math.max(Math.round(state.position) || 0, 0), starts.length - 1);
    setCurrent(starts[s]);
    const el = sentenceEls[s];
    el.scrollIntoView({ block: "start" });
    // Абзацы вне экрана измеряются при прокрутке, поэтому выравниваем ещё раз
    requestAnimationFrame(() => el.scrollIntoView({ block: "start" }));
  }

  /* ---------- Запуск ---------- */

  load();
  document.body.classList.toggle("text-only", textOnly);
  $("popPlay").hidden = textOnly;
  $("title").textContent = book.title;
  if (env.books.length > 1) {
    const select = $("bookSelect");
    env.books.forEach((b) => select.add(new Option(b.title, b.id, false, b.id === book.id)));
    select.hidden = false;
    $("title").hidden = true;
  }
  document.title = book.title;
  renderText();
  renderStats();
  $("sort").value = state.sort;
  renderList();
  bind();
  setSpeed(state.speed);
  setCurrent(0);
  setTextScale(state.textScale);
  sentenceEls[0].classList.add("cur");
  $("position").textContent = "Предложение 1 из " + starts.length;
  if (textOnly) {
    restoreReadingPlace();
  } else {
    audio.src = env.audioSrc;
    requestAnimationFrame(animate);
  }
};

// Приложение на экране «Домой»: книги, статусы и позиция хранятся только на этом устройстве
(function () {
  const BACKUP_KEY = "audio-english:lastBackup";
  const CHANGED_KEY = "audio-english:changedSinceBackup";
  const BACKUP_EVERY_MS = 3 * 24 * 3600 * 1000;
  const STATUSES = [1, 2, 3];

  /* ---------- Книги на устройстве ---------- */

  function openLibrary() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("audio-english", 2);
      request.onupgradeneeded = () => {
        const idb = request.result;
        if (!idb.objectStoreNames.contains("books")) idb.createObjectStore("books", { keyPath: "id" });
        if (!idb.objectStoreNames.contains("chunks")) idb.createObjectStore("chunks");
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function libraryCall(mode, call, stores) {
    return openLibrary().then((idb) => new Promise((resolve, reject) => {
      const tx = idb.transaction(stores || "books", mode);
      const request = call(stores ? tx : tx.objectStore("books"));
      tx.oncomplete = () => resolve(request.result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    }));
  }

  const listBooks = () => libraryCall("readonly", (books) => books.getAllKeys());
  const getBook = (id) => libraryCall("readonly", (books) => books.get(id));

  // Safari иногда портит сохранённые Blob, а слишком большую запись браузер не примет,
  // поэтому аудио хранится кусками по 8 МБ в виде массивов байтов
  const CHUNK = 8 * 1024 * 1024;
  const chunkKey = (id, i) => id + ":" + i;

  async function putBook(record) {
    if (!record.audio) {
      return libraryCall("readwrite", (books) => books.put({ id: record.id, title: record.title, data: record.data, textOnly: true }));
    }
    const size = record.audio.size;
    const count = Math.ceil(size / CHUNK);
    for (let i = 0; i < count; i++) {
      const bytes = await record.audio.slice(i * CHUNK, (i + 1) * CHUNK).arrayBuffer();
      await libraryCall("readwrite", (tx) => tx.objectStore("chunks").put(bytes, chunkKey(record.id, i)), ["chunks"]);
    }
    return libraryCall("readwrite", (books) => books.put({ id: record.id, title: record.title, data: record.data, chunks: count, size }));
  }

  async function loadBook(id) {
    const raw = await getBook(id);
    if (raw && raw.textOnly) return { id: raw.id, title: raw.title, data: raw.data, audio: null };
    if (!raw || !raw.chunks) return null;
    const parts = [];
    for (let i = 0; i < raw.chunks; i++) {
      const bytes = await libraryCall("readonly", (tx) => tx.objectStore("chunks").get(chunkKey(id, i)), ["chunks"]);
      if (!bytes) return null;
      parts.push(bytes);
    }
    const audio = new Blob(parts, { type: "audio/mp4" });
    return audio.size === raw.size ? { id: raw.id, title: raw.title, data: raw.data, audio } : null;
  }

  function isBookData(data) {
    return data && typeof data.id === "string" && typeof data.title === "string"
      && ["tokens", "times", "sentenceStarts", "vocab", "forms", "tokenVocab"].every((k) => Array.isArray(data[k]));
  }

  /* ---------- Резервная копия ---------- */

  // Файл «статусы слов.json» дополняет словарь; позицию берём только там, где её на устройстве нет
  function applyBackup(local, backup) {
    const clean = {};
    Object.keys(backup.statuses || {}).forEach((word) => {
      if (STATUSES.includes(backup.statuses[word])) clean[word] = backup.statuses[word];
    });
    local.setWords(clean);
    // Только что взятые из копии статусы новой копии не требуют
    local.write(BACKUP_KEY, Date.now());
    local.write(CHANGED_KEY, false);
    const positions = backup.positions || {};
    Object.keys(positions).forEach((id) => {
      const seconds = Number(positions[id]);
      if (seconds > 0 && !(local.position(id) > 0)) local.savePosition(id, seconds);
    });
    return Object.keys(clean).length;
  }

  function saveFile(local, filename, text) {
    const file = new File([text], filename, { type: "application/json" });
    const done = () => {
      local.write(BACKUP_KEY, Date.now());
      local.write(CHANGED_KEY, false);
      local.notify("");
    };
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      // На iPad откроется меню «Поделиться»: там выберите «Сохранить в Файлы»
      return navigator.share({ files: [file] }).then(done).catch(() => {});
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    done();
    return Promise.resolve();
  }

  function remindBackup(local) {
    const last = local.read(BACKUP_KEY) || 0;
    if (local.read(CHANGED_KEY) && Date.now() - last > BACKUP_EVERY_MS) {
      local.notify("Давно не было резервной копии. Нажмите «Экспорт» и сохраните файл в «Файлы».");
    }
  }

  /* ---------- Экран выбора файлов ---------- */

  function showPicker(local, onReady, options) {
    const box = document.createElement("div");
    box.className = "library";
    box.innerHTML = '<div class="library-card">'
      + '<h2 id="libTitle"></h2><p id="libIntro"></p>'
      + "<ol><li>Текст с расширением .book.json</li><li>Аудио с расширением .m4a (у книги без аудио его нет)</li>"
      + "<li>По желанию: резервная копия «статусы слов.json», она вернёт статусы и место, где вы остановились</li></ol>"
      + '<ul class="library-files"><li id="libText">Текст: не выбран</li><li id="libAudio">Аудио: не выбрано</li>'
      + '<li id="libBackup">Резервная копия: не выбрана</li></ul>'
      + '<label class="library-pick" role="button" tabindex="0">Выбрать файлы'
      + '<input id="libFiles" type="file" multiple hidden></label>'
      + '<p id="libStatus" class="library-error" hidden></p>'
      + (options.canClose ? '<button id="libClose" type="button">Закрыть</button>' : "")
      + "<p>Файлы можно выбрать все сразу или по одному. Книга останется в приложении, повторно выбирать её не нужно.</p>"
      + "</div>";
    box.querySelector("#libTitle").textContent = options.title;
    box.querySelector("#libIntro").textContent = options.intro;
    document.body.appendChild(box);

    const picked = { audio: null, data: null };
    const status = box.querySelector("#libStatus");
    const say = (text) => {
      status.textContent = text;
      status.hidden = !text;
    };
    const mark = (id, text) => {
      const line = box.querySelector(id);
      line.textContent = text;
      line.className = "ok";
    };

    if (options.canClose) box.querySelector("#libClose").addEventListener("click", () => box.remove());

    box.querySelector("#libFiles").addEventListener("change", async (e) => {
      say("");
      for (const file of e.target.files) {
        if (/\.json$/i.test(file.name)) {
          try {
            const data = JSON.parse(await file.text());
            if (isBookData(data)) {
              picked.data = data;
              mark("#libText", "Текст: " + data.title);
              if (data.noAudio) mark("#libAudio", "Аудио: не нужно, книга без аудио");
            } else if (data && data.statuses && typeof data.statuses === "object") {
              mark("#libBackup", "Резервная копия: статусов " + applyBackup(local, data));
            } else {
              throw new Error("unknown json");
            }
          } catch (err) {
            say("Файл " + file.name + " не похож ни на текст книги, ни на резервную копию.");
          }
        } else {
          picked.audio = file;
          mark("#libAudio", "Аудио: " + file.name);
        }
      }
      e.target.value = "";
      if (!picked.data || (!picked.audio && !picked.data.noAudio)) return;

      say("Сохраняю книгу в приложении…");
      const record = {
        id: picked.data.id, title: picked.data.title, data: picked.data,
        audio: picked.data.noAudio ? null : new Blob([picked.audio], { type: "audio/mp4" }),
      };
      let saved = true;
      try {
        await putBook(record);
      } catch (err) {
        saved = false;
      }
      box.remove();
      onReady(record, saved);
    });
  }

  /* ---------- Запуск ---------- */

  async function boot() {
    const local = window.createLocalStore();
    const remember = (id) => local.saveSettings(Object.assign(local.settings(), { book: id }));
    const reload = () => location.reload();

    // Просим iPad не стирать данные приложения; для приложения на экране «Домой» он обычно соглашается
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (e) { /* без этого тоже работает */ }

    // Отсчёт до первого напоминания идёт с первого запуска
    if (!local.read(BACKUP_KEY)) local.write(BACKUP_KEY, Date.now());

    // Любое изменение статуса — повод позже напомнить о резервной копии
    const setWords = local.setWords.bind(local);
    local.setWords = function (changes) {
      setWords(changes);
      local.write(CHANGED_KEY, true);
    };

    let ids = [];
    try {
      ids = await listBooks();
    } catch (e) {
      ids = [];
    }

    const describe = async (list) => {
      const books = [];
      for (const id of list) {
        const raw = await getBook(id);
        if (raw && (raw.chunks || raw.textOnly)) books.push({ id, title: raw.title });
      }
      return books;
    };

    const start = (record, books, savedOnDevice) => {
      window.startAudioEnglish(record.data, {
        store: local,
        audioSrc: record.audio ? URL.createObjectURL(record.audio) : null,
        books,
        saveFile: (filename, text) => saveFile(local, filename, text),
        selectBook(id) {
          remember(id);
          reload();
        },
        addBook() {
          showPicker(local, (added, saved) => {
            remember(added.id);
            if (saved) reload();
            else local.notify("Устройство не сохранило новую книгу: не хватает места.");
          }, { canClose: true, title: "Добавить книгу", intro: "Выберите файлы новой книги." });
        },
      });
      if (!savedOnDevice) local.notify("Книга не сохранилась в приложении: не хватает места. В следующий раз выберите файлы снова.");
      else remindBackup(local);
    };

    const chosen = local.settings().book;
    const wanted = ids.includes(chosen) ? chosen : ids[ids.length - 1];
    let record = null;
    if (wanted) {
      try {
        record = await loadBook(wanted);
      } catch (e) {
        record = null;
      }
    }
    if (record) {
      start(record, await describe(ids), true);
      return;
    }

    const wiped = !!local.settings().book;
    showPicker(local, async (added, saved) => {
      remember(added.id);
      let books = [{ id: added.id, title: added.title }];
      if (saved) {
        try {
          books = await describe(await listBooks());
        } catch (e) { /* оставляем одну книгу */ }
      }
      start(added, books, saved);
    }, wiped ? {
      title: "Выберите книгу снова",
      intro: "iPad убрал книгу из приложения. Выберите её файлы ещё раз. Статусы и место сохранились.",
    } : {
      title: "Добавьте книгу",
      intro: "Выберите файлы книги в «Файлах». Чтобы перенести статусы и место из прежней версии, добавьте и файл «статусы слов.json».",
    });
  }

  /* ---------- Обновление приложения ---------- */

  // Код приложения сохраняется на устройстве, поэтому оно открывается и без интернета.
  // Кнопка «Обновить» видна всегда: если новая версия уже скачана в фоне, она подсвечена
  // и включает её сразу; если нет — сама проверяет обновление и включает его.
  // Книги, статусы и место в аудио обновление не трогает.
  const REFRESH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>';

  function setupUpdates() {
    const button = document.createElement("button");
    button.id = "updateBtn";
    button.type = "button";
    button.className = "tool-btn icon-only update-btn";
    button.innerHTML = '<span class="upd-icon" aria-hidden="true">' + REFRESH_ICON + "</span>";
    button.setAttribute("aria-label", "Обновить приложение");
    const tools = document.getElementById("tools");
    tools.insertBefore(button, tools.firstChild);

    const supported = "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost");
    let ready = false, checking = false, registration = null;
    const idleTitle = "Проверить и установить новую версию. Книги и статусы не пострадают.";
    button.title = idleTitle;

    const markReady = () => {
      ready = true;
      button.classList.add("ready");
      button.title = "Готова новая версия: нажмите, чтобы включить её. Книги и статусы не пострадают.";
    };
    // Короткий ответ на месте значка: ✓ — новее версии нет, ! — нет связи
    const flash = (icon, title) => {
      const iconEl = button.querySelector(".upd-icon");
      iconEl.textContent = icon;
      button.title = title;
      setTimeout(() => {
        iconEl.innerHTML = REFRESH_ICON;
        if (!ready) button.title = idleTitle;
      }, 2500);
    };

    if (supported) {
      const hadVersion = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadVersion) return;
        if (checking) location.reload(); else markReady();
      });
      navigator.serviceWorker.register("sw.js").then((reg) => {
        registration = reg;
        // Приложение может днями висеть в памяти iPad: проверяем обновления при каждом возвращении
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update().catch(() => {});
        });
      }).catch(() => {});
    }

    button.addEventListener("click", async () => {
      if (ready || !supported || !registration) {
        location.reload();
        return;
      }
      if (checking) return;
      checking = true;
      button.classList.add("checking");
      try {
        await registration.update();
        // Новая версия ставится несколько секунд; когда она включится, страница перезагрузится сама
        const found = await new Promise((resolve) => {
          const started = Date.now();
          const look = () => {
            if (ready) return resolve(true);
            if (!registration.installing && !registration.waiting) return resolve(false);
            if (Date.now() - started > 15000) return resolve(true);
            setTimeout(look, 300);
          };
          look();
        });
        if (found) {
          location.reload();
          return;
        }
        flash("✓", "У вас последняя версия");
      } catch (e) {
        flash("!", "Нет связи с интернетом — проверить обновление не получилось");
      }
      checking = false;
      button.classList.remove("checking");
    });
  }

  setupUpdates();

  boot();
})();
</script>
